apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "market-maker.fullname" . }}
  labels:
    {{- include "market-maker.labels" . | nindent 4 }}
spec:
  # Exactly one Pod (values.schema.json refuses another count) and no surge during a deploy: trading's replacement call
  # checks only the trade sequence, which a replacement does not change, so two bots on one market would both succeed and
  # the last one would win, each re-pricing with its own settings or code on every trigger. Recreate stops the old Pod
  # before the new one starts; the resting offers keep filling during the short gap (ADR-057, README "Delivery").
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "market-maker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "market-maker.selectorLabels" . | nindent 8 }}
      annotations:
        # A changed environment ConfigMap restarts the Pod (it reads the environment only when it starts).
        # The runtime ConfigMap (runtime-configmap.yaml) is left out on purpose: the service re-reads its file.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Prometheus scrapes the metrics port of the Pod directly (the Service does not expose it).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The drain delay (at most 15 s) plus the 10 s a shutdown may take end inside this.
      terminationGracePeriodSeconds: 30
      containers:
        - name: market-maker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "market-maker.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
                optional: true
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "market-maker.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # A directory mount, never subPath: the kubelet updates a mounted ConfigMap by swapping a link inside the
            # directory, and a subPath mount would keep the first content for the life of the Pod.
            - name: runtime
              mountPath: {{ include "market-maker.runtimeDir" . }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: runtime
          configMap:
            name: {{ include "market-maker.runtimeConfigMap" . }}
